name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.15.8"
            otp: "26.2.5"
          - elixir: "1.20.3"
            otp: "29.0.5"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Elixir and OTP
        uses: erlef/setup-beam@v1
        with:
          version-type: strict
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Fetch dependencies
        run: mix deps.get

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test --cover --warnings-as-errors

  quality:
    name: Quality
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Elixir and OTP
        uses: erlef/setup-beam@v1
        with:
          version-type: strict
          elixir-version: "1.20.3"
          otp-version: "29.0.5"

      - name: Cache dependencies and PLTs
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-quality-otp-29.0.5-elixir-1.20.3-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-quality-otp-29.0.5-elixir-1.20.3-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Run Credo
        run: mix credo --strict

      - name: Run Dialyzer
        run: mix dialyzer --format github

      - name: Build documentation
        run: mix docs

      - name: Build Hex package
        run: mix hex.build

  release:
    name: Publish to Hex
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - test
      - quality
    runs-on: ubuntu-24.04
    env:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Elixir and OTP
        uses: erlef/setup-beam@v1
        with:
          version-type: strict
          elixir-version: "1.20.3"
          otp-version: "29.0.5"

      - name: Install Hex
        run: mix local.hex --force

      - name: Fetch dependencies
        run: mix deps.get

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="$(mix run --no-start -e 'IO.write(Mix.Project.config()[:version])')"
          if [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "::error::Tag $RELEASE_TAG does not match package version v$PACKAGE_VERSION"
            exit 1
          fi

      - name: Publish package and documentation
        run: mix hex.publish --yes
