name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.15.8"
            otp: "26.2.5"
          - elixir: "1.20.3"
            otp: "29.0.5"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Elixir and OTP
        uses: erlef/setup-beam@v1
        with:
          version-type: strict
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Fetch dependencies
        run: mix deps.get

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test --cover --warnings-as-errors

  quality:
    name: Quality
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Elixir and OTP
        uses: erlef/setup-beam@v1
        with:
          version-type: strict
          elixir-version: "1.20.3"
          otp-version: "29.0.5"

      - name: Cache dependencies and PLTs
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-quality-otp-29.0.5-elixir-1.20.3-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-quality-otp-29.0.5-elixir-1.20.3-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Run Credo
        run: mix credo --strict

      - name: Run Dialyzer
        run: mix dialyzer --format github

      - name: Build documentation
        run: mix docs

      - name: Build Hex package
        run: mix hex.build
